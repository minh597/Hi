
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Text Webhook</title>
<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f111a;
    color: #fff;
    font-family: Arial, sans-serif;
}

.container {
    width: 90%;
    max-width: 420px;
    background: #1b1e2b;
    padding: 25px;
    border-radius: 16px;
    border: 1px solid #30364a;
}

h2 {
    text-align: center;
    margin-top: 0;
}

textarea {
    width: 100%;
    height: 160px;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #41475d;
    background: #10131e;
    color: white;
    outline: none;
    resize: vertical;
    font-size: 15px;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 15px;
    border: none;
    border-radius: 9px;
    background: #6578ff;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: .5;
}

#status {
    text-align: center;
    font-size: 14px;
    margin-bottom: 0;
}
</style>
</head>
<body>

<div class="container">
    <h2>Text Webhook</h2>

    <textarea id="message"
        placeholder="Nhập nội dung tại đây..."></textarea>

    <button id="sendBtn" onclick="sendMessage()">
        GỬI
    </button>

    <p id="status"></p>
</div>

<script>
const WEBHOOK_URL = "https://discord.com/api/webhooks/1409756826131759245/WGUsXH4DXGzHzSiR1lmtJ9UaGoOlgr_wRHEe2Z5o4FwgupMKkpNXeAiZ-49oTbrR2VKW";

async function sendMessage() {
    const input = document.getElementById("message");
    const status = document.getElementById("status");
    const button = document.getElementById("sendBtn");

    const message = input.value.trim();

    if (!message) {
        status.textContent = "Chưa nhập nội dung!";
        return;
    }

    button.disabled = true;
    status.textContent = "Đang gửi...";

    try {
        const response = await fetch(WEBHOOK_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                content: "`" + message + "`"
            })
        });

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        status.textContent = "Gửi thành công!";
        input.value = "";

    } catch (error) {
        status.textContent = "Gửi thất bại: " + error.message;
    }

    button.disabled = false;
}
</script>

</body>
</html>
